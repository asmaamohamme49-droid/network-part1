  DATA.parts.part1.exam = QUIZ_QUESTIONS.filter(q=>['easy','medium'].includes(q.lvl)).slice(0,60).map(q=>({q:q.q,ar:q.ar,o:q.o,c:q.c,exp:q.exp,expAr:q.expAr,lvl:q.lvl.charAt(0).toUpperCase()+q.lvl.slice(1)}));
  DATA.parts.part2.exam = QUIZ_QUESTIONS.slice(0,60).map(q=>({q:q.q,ar:q.ar,o:q.o,c:q.c,exp:q.exp,expAr:q.expAr,lvl:q.lvl.charAt(0).toUpperCase()+q.lvl.slice(1)}));
  DATA.parts.part3.exam = QUIZ_QUESTIONS.slice(0,60).map(q=>({q:q.q,ar:q.ar,o:q.o,c:q.c,exp:q.exp,expAr:q.expAr,lvl:q.lvl.charAt(0).toUpperCase()+q.lvl.slice(1)}));
  // Final exam: 20 from each part
  const p1 = DATA.parts.part1.exam.slice(0,20).map(q=>({...q,from:'Part 1'}));
  const p2 = DATA.parts.part2.exam.slice(0,20).map(q=>({...q,from:'Part 2'}));
  const p3 = DATA.parts.part3.exam.slice(0,20).map(q=>({...q,from:'Part 3'}));
  DATA.finalExam = [...p1,...p2,...p3];
})();

    part3:{lessonsDone:[],lastLesson:0,flashcardsReviewed:[],examScore:null,examAnswers:[],wrongQuestions:[],completed:false}
  },
  quiz:{bestScore:null,currentIndex:0,answers:[],started:false},
  finalExamScore:null,
  lastLocation:null,
  theme:'light'
});
let progress = loadProgress();
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      const def = defaultProgress();
      return {...def, ...p, parts:{...def.parts, ...p.parts}, quiz:{...def.quiz, ...(p.quiz||{})}};
    }
  }catch(e){}
  return defaultProgress();
}
function saveProgress(){ try{localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));}catch(e){} }

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (sel)=>document.querySelector(sel);
const app = $('#app');
function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2500); }
function escapeHtml(s){ if(typeof s!=='string') return s; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pctForPart(partId){
  const p = progress.parts[partId]; if(!p) return 0;
  const data = DATA.parts[partId];
  let done=0,total=0;
  if(data.lessons.length){ done += (p.lessonsDone.length/data.lessons.length)*0.4; total+=0.4; }
  if(data.flashcards.length){ done += (p.flashcardsReviewed.length/data.flashcards.length)*0.2; total+=0.2; }
  if(p.examScore!==null){ done += (p.examScore/60)*0.4; total+=0.4; }
  if(total===0) return 0;
  return Math.round((done/total)*100);
}
function partStatus(partId){
  const p=progress.parts[partId]; const pct=pctForPart(partId);
  if(p.completed) return 'completed';
  if(pct>0 || p.lessonsDone.length>0) return 'inprogress';
  return 'notstarted';
}
function overallProgress(){ let s=0; for(const id in DATA.parts) s+=pctForPart(id); return Math.round(s/3); }
function performanceLevel(score){
  if(score>=54) return {label:'ممتاز – Excellent 🏆',cls:'good'};
  if(score>=42) return {label:'جيد جدًا – Very Good 🌟',cls:'good'};
  if(score>=30) return {label:'جيد – Good 👍',cls:''};
  if(score>=18) return {label:'مقبول – Pass ✔️',cls:''};
  return {label:'يحتاج مراجعة – Needs Review 📚',cls:'bad'};
}

/* ============================================================
   PART VIEW
   ============================================================ */
function openPart(partId){
  state.currentPart = partId;
  state.view = 'part';
  state.currentStage = 'study';
  state.lessonIndex = progress.parts[partId].lastLesson || 0;
  state.flashIndex = 0; state.flashShowAnswer = false;
  state.examIndex = 0; state.examSelected = null; state.examConfirmed = false;
  state.examTempAnswers = [];
  progress.lastLocation = {partId};
  saveProgress();
  renderPart();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderPart(){
  const partId = state.currentPart;
  const d = DATA.parts[partId]; const p = progress.parts[partId];
  const pct = pctForPart(partId);
  const stages = [
    {id:'study',label:'Study & Explanation',icon:'📖',done:p.lessonsDone.length===d.lessons.length},
    {id:'flashcards',label:'20 Flashcards',icon:'🃏',done:p.flashcardsReviewed.length===d.flashcards.length},
    {id:'summary',label:'20 Key Points',icon:'📝',done:p.lessonsDone.length===d.lessons.length},
    {id:'exam',label:'Final Exam (60)',icon:'✍️',done:p.examScore!==null},
    {id:'results',label:'Part Results',icon:'📊',done:p.examScore!==null}
  ];
  let stageTabs = '';
  stages.forEach((s,i)=>{ stageTabs += `<button class="stage-tab ${state.currentStage===s.id?'active':''} ${s.done?'done':''}" onclick="switchStage('${s.id}')"><span class="step-num">${s.done?'✓':i+1}</span> ${s.label}</button>`; });
  let content='';
  if(state.currentStage==='study') content = renderStudy(partId,d,p);
  else if(state.currentStage==='flashcards') content = renderFlashcards(partId,d,p);
  else if(state.currentStage==='summary') content = renderSummary(partId,d,p);
  else if(state.currentStage==='exam') content = renderExam(partId,d,p);
  else if(state.currentStage==='results') content = renderPartResults(partId,d,p);
  app.innerHTML = `
    <button class="btn secondary small" onclick="goDashboard()">← رجوع للوحة التحكم</button>
    <h1 class="page-title" style="margin-top:16px;">${d.title}</h1>
    <p class="page-sub">${d.pages} • نسبة الإنجاز: <strong style="color:var(--blue);">${pct}%</strong></p>
    <div class="stage-tabs">${stageTabs}</div>
    <div id="stageContent">${content}</div>`;
}

function switchStage(stage){
  state.currentStage = stage;
  state.flashShowAnswer = false;
  state.flashIndex = 0;
  if(stage==='exam'){ state.examIndex=0; state.examSelected=null; state.examConfirmed=false; state.examTempAnswers=[]; }
  renderPart();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* STUDY */
function renderStudy(partId,d,p){
  const li = Math.min(state.lessonIndex, d.lessons.length-1);
  const lesson = d.lessons[li];
  const isDone = p.lessonsDone.includes(li);
  let pills = '';
  d.lessons.forEach((L,i)=>{ const done=p.lessonsDone.includes(i); pills += `<button class="lesson-pill ${i===li?'active':''} ${done?'done':''}" onclick="gotoLesson(${i})">${done?'✓ ':''}${i+1}. ${L.title.split(' ').slice(0,2).join(' ')}</button>`; });
  let termsTable = '';
  if(lesson.terms){
    termsTable = `<table class="term-table"><tr><th>Term (English)</th><th>المعنى بالعربية</th></tr>`;
    lesson.terms.forEach(([t,a])=>{ termsTable += `<tr><td>${escapeHtml(t)}</td><td>${escapeHtml(a)}</td></tr>`; });
    termsTable += `</table>`;
  }
  const actions = `
    <div class="lesson-actions">
      <button class="btn secondary" onclick="gotoLesson(${li-1})" ${li===0?'disabled':''}>← Previous Lesson</button>
      <button class="btn ${isDone?'green':''}" onclick="markLessonDone(${li})" ${isDone?'disabled':''}>${isDone?'✓ Completed':'Mark as Completed'}</button>
      <button class="btn" onclick="gotoLesson(${li+1})" ${li===d.lessons.length-1?'disabled':''}>Next Lesson →</button>
    </div>`;
  return `
    <div class="lesson-nav">${pills}</div>
    <div class="study-card">
      <h2>${lesson.title}</h2>
      <p class="lesson-subtitle">الدرس ${li+1} من ${d.lessons.length}</p>
      <div class="content-block"><h4><span class="ico">🇬🇧</span> Original Text (English)</h4><div class="en-text en">${escapeHtml(lesson.en)}</div></div>
      <div class="content-block"><h4><span class="ico">🇪🇬</span> الترجمة العربية</h4><div class="ar-text">${escapeHtml(lesson.ar)}</div></div>
      <div class="content-block"><h4><span class="ico">💡</span> شرح مبسط (مصري)</h4><div class="explain">${escapeHtml(lesson.explain)}</div></div>
      ${lesson.terms?`<div class="content-block"><h4><span class="ico">📚</span> المصطلحات العلمية</h4>${termsTable}</div>`:''}
      ${lesson.exam?`<div class="content-block"><h4><span class="ico">🎯</span> أهم معلومات الامتحان</h4><div class="exam-note"><strong>Exam Focus:</strong> ${escapeHtml(lesson.exam)}</div></div>`:''}
      ${actions}
    </div>`;
}
function gotoLesson(i){
  const d = DATA.parts[state.currentPart];
  if(i<0 || i>=d.lessons.length) return;
  state.lessonIndex = i;
  progress.parts[state.currentPart].lastLesson = i;
  saveProgress();
  renderPart();
  window.scrollTo({top:0,behavior:'smooth'});
}
function markLessonDone(i){
  const p = progress.parts[state.currentPart];
  if(!p.lessonsDone.includes(i)){ p.lessonsDone.push(i); p.lessonsDone.sort((a,b)=>a-b); saveProgress(); showToast('✓ تم إكمال الدرس!'); }
  const d = DATA.parts[state.currentPart];
  if(i < d.lessons.length-1){ state.lessonIndex = i+1; p.lastLesson = i+1; saveProgress(); }
  renderPart();
}

/* FLASHCARDS */
function renderFlashcards(partId,d,p){
  const idx = state.flashIndex; const card = d.flashcards[idx]; const reviewed = p.flashcardsReviewed.includes(idx); const showAns = state.flashShowAnswer;
  return `
    <div class="flash-wrap">
      <div class="flash-counter">Flashcard ${idx+1} of ${d.flashcards.length}</div>
      <div class="flash-card">
        <div class="flash-label">QUESTION – السؤال</div>
        <div class="flash-q en">${escapeHtml(card.q)}</div>
        ${showAns?`<div class="flash-answer"><div class="ans-en en"><strong>Answer:</strong> ${escapeHtml(card.a)}</div><div class="ans-ar"><strong>الترجمة:</strong> ${escapeHtml(card.ar)}</div></div>`:''}
      </div>
      <div class="flash-controls">
        <button class="btn secondary" onclick="prevFlash()" ${idx===0?'disabled':''}>← Previous</button>
        ${!showAns?`<button class="btn" onclick="showFlashAnswer()">👁️ Show Answer</button>`:`<button class="btn green" onclick="markFlashReviewed()">${reviewed?'✓ Reviewed':'Mark as Reviewed'}</button>`}
        <button class="btn secondary" onclick="nextFlash()" ${idx===d.flashcards.length-1?'disabled':''}>Next →</button>
        <button class="btn secondary" onclick="shuffleFlash()">🔀 Shuffle</button>
      </div>
      <div class="reviewed-tag">${reviewed?'✓ تمت مراجعة هذه البطاقة':''}</div>
    </div>`;
}
function showFlashAnswer(){ state.flashShowAnswer = true; renderPart(); }
function prevFlash(){ if(state.flashIndex>0){ state.flashIndex--; state.flashShowAnswer=false; renderPart(); } }
function nextFlash(){ const d = DATA.parts[state.currentPart]; if(state.flashIndex<d.flashcards.length-1){ state.flashIndex++; state.flashShowAnswer=false; renderPart(); } }
function markFlashReviewed(){
  const p = progress.parts[state.currentPart]; const idx = state.flashIndex;
  if(!p.flashcardsReviewed.includes(idx)){ p.flashcardsReviewed.push(idx); p.flashcardsReviewed.sort((a,b)=>a-b); saveProgress(); showToast('✓ تمت مراجعة البطاقة!'); }
  renderPart();
}
function shuffleFlash(){ state.flashIndex = Math.floor(Math.random()*DATA.parts[state.currentPart].flashcards.length); state.flashShowAnswer=false; renderPart(); }

/* SUMMARY */
function renderSummary(partId,d,p){
  let items = '';
  d.summary.forEach((s,i)=>{ items += `<div class="summary-item"><div class="summary-num">${i+1}</div><div class="summary-body"><div class="summary-en en">${escapeHtml(s.en)}</div><div class="summary-ar">${escapeHtml(s.ar)}</div></div><button class="star-btn" onclick="toggleStar(this)" title="مهم للمراجعة">★</button></div>`; });
  return `<div class="summary-list">${items}</div><p style="text-align:center; color:var(--text-soft); font-size:.8rem; margin-top:16px;">اضغط ★ لحفظ النقاط المهمة للمراجعة.</p>`;
}
function toggleStar(btn){ btn.classList.toggle('on'); showToast(btn.classList.contains('on')?'⭐ تم حفظ النقطة':'تم إلغاء الحفظ'); }

/* EXAM */
function renderExam(partId,d,p){
  const idx = state.examIndex; const q = d.exam[idx]; const total = d.exam.length;
  const selected = state.examSelected; const confirmed = state.examConfirmed;
  let options = '';
  q.o.forEach((opt,i)=>{
    let cls = 'option';
    if(confirmed){ cls+=' disabled'; if(i===q.c) cls+=' correct'; else if(i===selected) cls+=' wrong'; }
    else if(i===selected) cls += ' selected';
    options += `<div class="${cls}" onclick="selectOption(${i})"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span class="en">${escapeHtml(opt)}</span></div>`;
  });
  let feedback = '';
  if(confirmed){
    const isC = selected===q.c;
    feedback = `<div class="exam-feedback ${isC?'correct':'wrong'}"><div class="fb-title ${isC?'correct':'wrong'}">${isC?'✓ إجابة صحيحة!':'✗ إجابة خاطئة'}</div><div class="fb-body"><div>${isC?'Correct! الإجابة الصحيحة هي: ':'الإجابة الصحيحة هي: '}<strong class="en">${escapeHtml(q.o[q.c])}</strong></div><div style="margin-top:8px;"><strong>Explanation:</strong> ${escapeHtml(q.exp)}</div><div class="fb-ar"><strong>الشرح:</strong> ${escapeHtml(q.expAr)}</div></div></div>`;
  }
  const isLast = idx===total-1;
  return `
    <div class="exam-wrap">
      <div class="exam-head"><div class="exam-progress"><div class="exam-q-num">Question ${idx+1} of ${total} • ${q.lvl||'Medium'}</div><div class="progress-bar"><div class="progress-fill" style="width:${(idx/total)*100}%"></div></div></div></div>
      <div class="exam-card">
        <div class="exam-q-text en">${escapeHtml(q.q)}</div>
        <div class="exam-q-text-ar">${escapeHtml(q.ar)}</div>
        <div style="margin-top:18px;">${options}</div>
        ${!confirmed?`<button class="btn full mt-16" onclick="confirmAnswer()" ${selected===null?'disabled':''}>Confirm Answer</button>`:feedback}
        ${confirmed?`<div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">${!isLast?`<button class="btn full" onclick="nextExamQuestion()">Next Question →</button>`:`<button class="btn green full" onclick="finishExam()">إظهار النتيجة النهائية 📊</button>`}</div>`:''}
      </div>
    </div>`;
}
function selectOption(i){ if(state.examConfirmed) return; state.examSelected=i; renderPart(); }
function confirmAnswer(){
  if(state.examSelected===null) return;
  state.examConfirmed = true;
  const q = DATA.parts[state.currentPart].exam[state.examIndex];
  state.examTempAnswers[state.examIndex] = {qIndex:state.examIndex,selected:state.examSelected,correct:q.c,isCorrect:state.examSelected===q.c};
  renderPart();
}
function nextExamQuestion(){ state.examIndex++; state.examSelected=null; state.examConfirmed=false; renderPart(); window.scrollTo({top:0,behavior:'smooth'}); }
function finishExam(){
  const partId = state.currentPart; const d = DATA.parts[partId]; const p = progress.parts[partId];
  let correct=0; const answers=[]; const wrong=[];
  d.exam.forEach((q,i)=>{
    const a = state.examTempAnswers[i]; const sel = a?a.selected:-1; const isC = sel===q.c;
    if(isC) correct++;
    answers.push({i,selected:sel,correct:q.c,isCorrect:isC});
    if(!isC) wrong.push({qIndex:i,q:q.q,correctAns:q.o[q.c],exp:q.exp,expAr:q.expAr});
  });
  p.examScore = correct; p.examAnswers = answers; p.wrongQuestions = wrong;
  if(correct >= 36) p.completed = true;
  saveProgress();
  state.currentStage = 'results';
  renderPart();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* RESULTS */
function renderPartResults(partId,d,p){
  if(p.examScore===null){
    return `<div class="center" style="padding:40px 20px;"><p style="font-size:1.1rem; color:var(--text-soft); margin-bottom:18px;">لم تجرِ الاختبار بعد.</p><button class="btn" onclick="switchStage('exam')">اذهب للاختبار →</button></div>`;
  }
  const score = p.examScore; const pct = Math.round((score/60)*100); const perf = performanceLevel(score); const correctCount = score; const wrongCount = 60-score;
  let wrongList = '';
  if(p.wrongQuestions.length){
    wrongList = `<h3 style="color:var(--navy); margin-bottom:12px; font-size:1rem;">❌ الأسئلة الخاطئة (${wrongCount})</h3><div class="wrong-list">${p.wrongQuestions.map(w=>`<div class="wrong-item"><div class="wq en">${escapeHtml(w.q)}</div><div class="wa">✓ الإجابة الصحيحة: <span class="en">${escapeHtml(w.correctAns)}</span></div><div style="font-size:.82rem; color:var(--text-soft); margin-top:6px;">${escapeHtml(w.expAr)}</div></div>`).join('')}</div>`;
  }
  let nextPartBtn = '';
  if(partId==='part1') nextPartBtn = `<button class="btn" onclick="openPart('part2')">Continue to Part 2 →</button>`;
  else if(partId==='part2') nextPartBtn = `<button class="btn" onclick="openPart('part3')">Continue to Part 3 →</button>`;
  else nextPartBtn = `<button class="btn green" onclick="openFinal()">Go to Final Revision 🎓</button>`;
  return `
    <div class="results-wrap">
      <div class="score-circle" style="--pct:${pct}%"><div class="score-inner"><div class="score-num">${score}<span style="font-size:1rem; color:var(--text-soft);">/60</span></div><div class="score-lbl">${pct}%</div></div></div>
      <div class="perf-banner" style="background:var(--bg-soft); color:${pct>=70?'var(--green)':pct>=50?'var(--amber)':'var(--red)'};">${perf.label}</div>
      <div class="results-grid">
        <div class="result-box good"><div class="num">${correctCount}</div><div class="lbl">Correct Answers</div></div>
        <div class="result-box bad"><div class="num">${wrongCount}</div><div class="lbl">Wrong Answers</div></div>
        <div class="result-box"><div class="num">${pct}%</div><div class="lbl">Percentage</div></div>
        <div class="result-box"><div class="num">${p.completed?'✓':'—'}</div><div class="lbl">Part Status</div></div>
      </div>
      ${wrongList}
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;">
        <button class="btn secondary" onclick="switchStage('exam')">Retake Exam 🔄</button>
        ${nextPartBtn}
      </div>
    </div>`;
}

/* ============================================================
   NEW: STANDALONE 60-QUESTION QUIZ
   ============================================================ */
function openQuiz(){
  state.view = 'quiz';
  state.quizIndex = progress.quiz.currentIndex || 0;
  state.quizSelected = null;
  state.quizConfirmed = false;
  state.quizAnswers = progress.quiz.answers || [];
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuiz(){
  if(state.quizIndex >= QUIZ_QUESTIONS.length){ renderQuizResults(); return; }
  const q = QUIZ_QUESTIONS[state.quizIndex];
  const total = QUIZ_QUESTIONS.length;
  const current = state.quizIndex + 1;
  const pct = Math.round((state.quizIndex/total)*100);
  let optionsHTML = '';
  q.o.forEach((opt,i)=>{
    let cls = 'option';
    if(state.quizConfirmed){ cls += ' disabled'; if(i===q.c) cls += ' correct'; else if(i===state.quizSelected) cls += ' wrong'; }
    else if(i===state.quizSelected) cls += ' selected';
    const letter = String.fromCharCode(65+i);
    optionsHTML += `<div class="${cls}" onclick="quizSelect(${i})"><span class="opt-letter">${letter}</span><span class="en">${escapeHtml(opt)}</span></div>`;
  });
  let feedbackHTML = '';
  if(state.quizConfirmed){
    const isCorrect = state.quizSelected === q.c;
    feedbackHTML = `<div class="exam-feedback ${isCorrect?'correct':'wrong'}"><div class="fb-title ${isCorrect?'correct':'wrong'}">${isCorrect?'✓ إجابة صحيحة!':'✗ إجابة خاطئة'}</div><div class="fb-body"><div><strong>Correct Answer:</strong> <span class="en">${escapeHtml(q.o[q.c])}</span></div><div style="margin-top:8px;"><strong>Explanation:</strong> ${escapeHtml(q.exp)}</div><div class="fb-ar"><strong>الشرح:</strong> ${escapeHtml(q.expAr)}</div></div></div>`;
  }
  const isLast = state.quizIndex === total-1;
  const lvlClass = q.lvl==='easy'?'easy':q.lvl==='medium'?'medium':'hard';
  const lvlText = q.lvl.charAt(0).toUpperCase()+q.lvl.slice(1);
  app.innerHTML = `
    <button class="btn secondary small" onclick="goDashboard()">← رجوع للوحة التحكم</button>
    <div class="quiz-hero" style="margin-top:14px;">
      <div class="quiz-hero-title">🎯 Comprehensive Quiz – 60 Questions</div>
      <div class="quiz-hero-sub">سؤال واحد في كل مرة – اختر إجابتك ثم اضغط Confirm Answer لعرض التصحيح والتفسير</div>
      <div class="progress-meta" style="margin-bottom:6px;"><span>Question ${current} of ${total}</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="exam-card">
      <div class="q-meta"><span class="q-num">سؤال ${current}</span><span class="q-level ${lvlClass}">${lvlText}</span></div>
      <div class="exam-q-text en">${escapeHtml(q.q)}</div>
      <div class="exam-q-text-ar">${escapeHtml(q.ar)}</div>
      <div style="margin-top:18px;">${optionsHTML}</div>
      ${feedbackHTML}
      <div style="margin-top:16px;">
        ${!state.quizConfirmed
          ? `<button class="btn full" onclick="quizConfirm()" ${state.quizSelected===null?'disabled':''}>Confirm Answer</button>`
          : (isLast
              ? `<button class="btn green full" onclick="quizFinish()">إظهار النتيجة النهائية 📊</button>`
              : `<button class="btn full" onclick="quizNext()">Next Question →</button>`)}
      </div>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function quizSelect(i){
  if(state.quizConfirmed) return;
  state.quizSelected = i;
  renderQuiz();
}
function quizConfirm(){
  if(state.quizSelected === null) return;
  state.quizConfirmed = true;
  const q = QUIZ_QUESTIONS[state.quizIndex];
  state.quizAnswers[state.quizIndex] = { selected: state.quizSelected, correct: q.c, isCorrect: state.quizSelected === q.c };
  progress.quiz.answers = state.quizAnswers;
  progress.quiz.currentIndex = state.quizIndex;
  progress.quiz.started = true;
  saveProgress();
  renderQuiz();
}
function quizNext(){
  state.quizIndex++;
  state.quizSelected = null;
  state.quizConfirmed = false;
  progress.quiz.currentIndex = state.quizIndex;
  saveProgress();
  renderQuiz();
}
function quizFinish(){
  state.quizIndex = QUIZ_QUESTIONS.length;
  let correct = 0;
  state.quizAnswers.forEach(a=>{ if(a && a.isCorrect) correct++; });
  const best = progress.quiz.bestScore;
  if(best === null || correct > best) progress.quiz.bestScore = correct;
  progress.quiz.started = false;
  progress.quiz.currentIndex = 0;
  progress.quiz.answers = [];
  saveProgress();
  renderQuizResults();
}

function renderQuizResults(){
  let correct = 0;
  state.quizAnswers.forEach(a=>{ if(a && a.isCorrect) correct++; });
  const total = QUIZ_QUESTIONS.length;
  const wrong = total - correct;
  const pct = Math.round((correct/total)*100);
  const perf = performanceLevel(correct);
  let wrongItems = '';
  state.quizAnswers.forEach((a,i)=>{
    if(a && !a.isCorrect){
      const q = QUIZ_QUESTIONS[i];
      wrongItems += `<div class="wrong-item"><div class="wq">سؤال ${i+1}: <span class="en">${escapeHtml(q.q)}</span></div><div class="wa">✓ الإجابة الصحيحة: <span class="en">${escapeHtml(q.o[q.c])}</span></div><div style="font-size:.82rem; color:var(--text-soft); margin-top:6px;">${escapeHtml(q.expAr)}</div></div>`;
    }
  });
  app.innerHTML = `
    <button class="btn secondary small" onclick="goDashboard()">← رجوع للوحة التحكم</button>
    <div class="results-wrap" style="margin-top:20px;">
      <div class="results-wrap">
        <div class="center" style="font-size:1.5rem; font-weight:800; color:var(--navy); margin-bottom:16px;">🏁 النتيجة النهائية – Quiz</div>
        <div class="score-circle" style="--pct:${pct}%"><div class="score-inner"><div class="score-num">${correct}<span style="font-size:1rem; color:var(--text-soft);">/${total}</span></div><div class="score-lbl">${pct}%</div></div></div>
        <div class="perf-banner" style="background:var(--bg-soft); color:${pct>=70?'var(--green)':pct>=50?'var(--amber)':'var(--red)'};">${perf.label}</div>
        <div class="results-grid">
          <div class="result-box good"><div class="num">${correct}</div><div class="lbl">Correct</div></div>
          <div class="result-box bad"><div class="num">${wrong}</div><div class="lbl">Wrong</div></div>
          <div class="result-box"><div class="num">${pct}%</div><div class="lbl">Percentage</div></div>
          <div class="result-box"><div class="num">${progress.quiz.bestScore||correct}/60</div><div class="lbl">Best Score</div></div>
        </div>
        ${wrongItems?`<h3 style="color:var(--navy); margin-bottom:12px;">❌ الأسئلة الخاطئة (${wrong})</h3><div class="wrong-list">${wrongItems}</div>`:''}
        <div style="display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap;">
          <button class="btn" onclick="restartQuiz()">🔄 إعادة الاختبار</button>
          <button class="btn secondary" onclick="goDashboard()">العودة للوحة التحكم</button>
        </div>
      </div>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartQuiz(){
  state.quizIndex = 0;
  state.quizSelected = null;
  state.quizConfirmed = false;
  state.quizAnswers = [];
  progress.quiz = { bestScore: progress.quiz.bestScore, currentIndex: 0, answers: [], started: true };
  saveProgress();
  state.view = 'quiz';
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   FINAL REVISION
   ============================================================ */
function openFinal(){
  state.view = 'final';
  renderFinal();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderFinal(){
  let allFlashcards = [];
  for(const id of ['part1','part2','part3']) DATA.parts[id].flashcards.forEach(f=>allFlashcards.push({...f,part:id}));
  let allTerms = []; const seen = new Set();
  for(const id of ['part1','part2','part3']) DATA.parts[id].lessons.forEach(L=>(L.terms||[]).forEach(([t,a])=>{ if(!seen.has(t)){seen.add(t); allTerms.push({t,a});} }));
  const totalScore = ['part1','part2','part3'].reduce((a,id)=>a+(progress.parts[id].examScore||0),0);
  let partsSummary = '';
  for(const id of ['part1','part2','part3']){
    const d = DATA.parts[id]; const p = progress.parts[id];
    partsSummary += `<div class="summary-item"><div class="summary-num" style="background:var(--navy);">${id.slice(-1)}</div><div class="summary-body"><div class="summary-en">${d.title} — ${p.examScore!==null?p.examScore+'/60':'لم يختبر بعد'}</div><div class="summary-ar">${p.lessonsDone.length}/${d.lessons.length} دروس • ${p.flashcardsReviewed.length}/${d.flashcards.length} بطاقات</div></div><button class="btn small secondary" onclick="openPart('${id}')">فتح</button></div>`;
  }
  const termsTable = allTerms.map(x=>`<tr><td class="en">${escapeHtml(x.t)}</td><td>${escapeHtml(x.a)}</td></tr>`).join('');
  app.innerHTML = `
    <button class="btn secondary small" onclick="goDashboard()">← رجوع للوحة التحكم</button>
    <h1 class="page-title" style="margin-top:16px;">🎓 Final Chapter Revision – المراجعة النهائية</h1>
    <p class="page-sub">مراجعة شاملة لجميع أجزاء الفصل الدراسي</p>
    <div class="revision-section">
      <h3>📊 ملخص نتائج الأجزاء</h3>
      ${partsSummary}
      <div class="results-grid" style="margin-top:16px;">
        <div class="result-box"><div class="num">${totalScore}/180</div><div class="lbl">مجموع الاختبارات</div></div>
        <div class="result-box"><div class="num">${allFlashcards.length}</div><div class="lbl">إجمالي Flashcards</div></div>
        <div class="result-box"><div class="num">${allTerms.length}</div><div class="lbl">مصطلح تقني</div></div>
      </div>
    </div>
    <div class="revision-section">
      <h3>🃏 مراجعة جميع الـ Flashcards (${allFlashcards.length})</h3>
      <p style="color:var(--text-soft); font-size:.88rem; margin-bottom:12px;">مراجعة سريعة لكل البطاقات من الأجزاء الثلاثة.</p>
      <div id="finalFlashArea"></div>
      <button class="btn" onclick="startFinalFlashReview()">ابدأ مراجعة البطاقات →</button>
    </div>
    <div class="revision-section">
      <h3>📚 أهم المصطلحات التقنية (${allTerms.length})</h3>
      <table class="term-table"><tr><th>Term</th><th>المعنى</th></tr>${termsTable}</table>
    </div>
    <div class="revision-section center">
      <h3>✍️ الاختبار النهائي الشامل</h3>
      <p style="color:var(--text-soft); font-size:.88rem; margin-bottom:16px;">60 سؤالًا جديدًا يغطي الأجزاء الثلاثة (20 لكل جزء).</p>
      <button class="btn" onclick="openFinalExam()">ابدأ الاختبار النهائي الشامل →</button>
    </div>`;
}
function startFinalFlashReview(){
  state.finalFlashList = [];
  for(const id of ['part1','part2','part3']) DATA.parts[id].flashcards.forEach(f=>state.finalFlashList.push({...f,part:id}));
  state.finalFlashList.sort(()=>Math.random()-0.5);
  state.finalFlashIdx = 0;
  renderFinalFlash();
}
function renderFinalFlash(){
  const area = $('#finalFlashArea'); if(!area) return;
  const idx = state.finalFlashIdx || 0;
  if(idx >= state.finalFlashList.length){ area.innerHTML = '<p class="center" style="padding:20px; color:var(--green); font-weight:700;">✓ أكملت مراجعة جميع البطاقات!</p>'; return; }
  const f = state.finalFlashList[idx];
  area.innerHTML = `<div class="flash-card" style="margin-bottom:14px;"><div class="flash-label">Card ${idx+1} of ${state.finalFlashList.length}</div><div class="flash-q en">${escapeHtml(f.q)}</div><div class="flash-answer"><div class="ans-en en"><strong>Answer:</strong> ${escapeHtml(f.a)}</div><div class="ans-ar"><strong>الترجمة:</strong> ${escapeHtml(f.ar)}</div></div></div><div class="flash-controls"><button class="btn secondary" onclick="finalFlashPrev()" ${idx===0?'disabled':''}>← Previous</button><button class="btn" onclick="finalFlashNext()">${idx<state.finalFlashList.length-1?'Next →':'إنهاء'}</button></div>`;
}
function finalFlashNext(){ state.finalFlashIdx++; renderFinalFlash(); }
function finalFlashPrev(){ if(state.finalFlashIdx>0){ state.finalFlashIdx--; renderFinalFlash(); } }

/* FINAL EXAM */
function openFinalExam(){
  state.view = 'finalExam';
  state.finalExam = { idx:0, selected:null, confirmed:false, answers:[], questions:DATA.finalExam, order:shuffleArray(DATA.finalExam.map((_,i)=>i)) };
  renderFinalExam();
  window.scrollTo({top:0,behavior:'smooth'});
}
function shuffleArray(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function renderFinalExam(){
  const st = state.finalExam; const idx = st.idx; const realIdx = st.order[idx]; const q = st.questions[realIdx]; const total = st.questions.length;
  let options = '';
  q.o.forEach((opt,i)=>{ let cls='option'; if(st.confirmed){ cls+=' disabled'; if(i===q.c) cls+=' correct'; else if(i===st.selected) cls+=' wrong'; } else if(i===st.selected) cls+=' selected'; options += `<div class="${cls}" onclick="finalSelect(${i})"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span class="en">${escapeHtml(opt)}</span></div>`; });
  let feedback = '';
  if(st.confirmed){ const isC = st.selected===q.c; feedback = `<div class="exam-feedback ${isC?'correct':'wrong'}"><div class="fb-title ${isC?'correct':'wrong'}">${isC?'✓ إجابة صحيحة!':'✗ إجابة خاطئة'}</div><div class="fb-body"><div><strong>Correct Answer:</strong> <span class="en">${escapeHtml(q.o[q.c])}</span></div><div style="margin-top:8px;"><strong>Explanation:</strong> ${escapeHtml(q.exp)}</div><div class="fb-ar">${escapeHtml(q.expAr)}</div></div></div>`; }
  const isLast = idx===total-1;
  app.innerHTML = `
    <button class="btn secondary small" onclick="goDashboard()">← رجوع للوحة التحكم</button>
    <h1 class="page-title" style="margin-top:14px;">✍️ الاختبار النهائي الشامل</h1>
    <p class="page-sub">${q.from} • Question ${idx+1} of ${total}</p>
    <div class="exam-wrap" style="margin-top:20px;">
      <div class="progress-bar" style="margin-bottom:20px;"><div class="progress-fill" style="width:${(idx/total)*100}%"></div></div>
      <div class="exam-card">
        <div class="exam-q-text en">${escapeHtml(q.q)}</div>
        <div class="exam-q-text-ar">${escapeHtml(q.ar)}</div>
        <div style="margin-top:18px;">${options}</div>
        ${!st.confirmed?`<button class="btn full mt-16" onclick="finalConfirm()" ${st.selected===null?'disabled':''}>Confirm Answer</button>`:feedback}
        ${st.confirmed?(isLast?`<button class="btn green full mt-16" onclick="finalFinish()">إظهار النتيجة النهائية 📊</button>`:`<button class="btn full mt-16" onclick="finalNext()">Next Question →</button>`):''}
      </div>
    </div>`;
}
function finalSelect(i){ if(state.finalExam.confirmed) return; state.finalExam.selected=i; renderFinalExam(); }
function finalConfirm(){ const st=state.finalExam; if(st.selected===null) return; st.confirmed=true; const realIdx=st.order[st.idx]; const q=st.questions[realIdx]; st.answers[st.idx]={realIdx,selected:st.selected,correct:q.c,isCorrect:st.selected===q.c}; renderFinalExam(); }
function finalNext(){ const st=state.finalExam; st.idx++; st.selected=null; st.confirmed=false; renderFinalExam(); window.scrollTo({top:0,behavior:'smooth'}); }
function finalFinish(){
  const st = state.finalExam; let correct=0; const wrong=[];
  st.answers.forEach(a=>{ if(!a) return; if(a.isCorrect) correct++; else { const q=st.questions[a.realIdx]; wrong.push({q:q.q,correctAns:q.o[q.c],exp:q.exp,expAr:q.expAr}); } });
  progress.finalExamScore = correct; saveProgress();
  const pct = Math.round((correct/60)*100);
  const perf = performanceLevel(correct);
  app.innerHTML = `
    <button class="btn secondary small" onclick="goDashboard()">← رجوع للوحة التحكم</button>
    <div class="results-wrap" style="margin-top:20px;">
      <h1 class="page-title center">🏁 النتيجة النهائية للاختبار الشامل</h1>
      <div class="score-circle" style="--pct:${pct}%; margin-top:24px;"><div class="score-inner"><div class="score-num">${correct}<span style="font-size:1rem; color:var(--text-soft);">/60</span></div><div class="score-lbl">${pct}%</div></div></div>
      <div class="perf-banner" style="background:var(--bg-soft); color:${pct>=70?'var(--green)':pct>=50?'var(--amber)':'var(--red)'};">${perf.label}</div>
      <div class="results-grid">
        <div class="result-box good"><div class="num">${correct}</div><div class="lbl">Correct</div></div>
        <div class="result-box bad"><div class="num">${60-correct}</div><div class="lbl">Wrong</div></div>
        <div class="result-box"><div class="num">${pct}%</div><div class="lbl">Percentage</div></div>
      </div>
      ${wrong.length?`<h3 style="color:var(--navy); margin-bottom:12px;">❌ الأسئلة الخاطئة</h3><div class="wrong-list">${wrong.map(w=>`<div class="wrong-item"><div class="wq en">${escapeHtml(w.q)}</div><div class="wa">✓ <span class="en">${escapeHtml(w.correctAns)}</span></div><div style="font-size:.82rem; color:var(--text-soft); margin-top:6px;">${escapeHtml(w.expAr)}</div></div>`).join('')}</div>`:'<p class="center" style="color:var(--green); font-weight:700;">🎉 ممتاز! لا توجد أسئلة خاطئة.</p>'}
      <div style="display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap;">
        <button class="btn" onclick="openFinalExam()">إعادة الاختبار 🔄</button>
        <button class="btn secondary" onclick="goDashboard()">العودة للوحة التحكم</button>
      </div>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   NAVIGATION & THEME
   ============================================================ */
function goDashboard(){ state.view='dashboard'; state.currentPart=null; renderDashboard(); window.scrollTo({top:0,behavior:'smooth'}); }
function initTheme(){ const saved = progress.theme || 'light'; document.documentElement.setAttribute('data-theme', saved); updateThemeBtn(saved); }
function toggleTheme(){ const cur = document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; const next = cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', next); progress.theme = next; saveProgress(); updateThemeBtn(next); }
function updateThemeBtn(t){ $('#themeBtn').textContent = t==='dark'?'☀️':'🌙'; }

function init(){
  initTheme();
  $('#themeBtn').addEventListener('click', toggleTheme);
  renderDashboard();
}
init();
</script>
</body>
</html>
